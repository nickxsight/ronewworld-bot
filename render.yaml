services:
  - type: web
    name: ronewworld-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEFAULT_CHANNEL_ID
        sync: false
      - key: DEFAULT_ROLE_ID
        sync: false
